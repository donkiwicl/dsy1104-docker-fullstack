server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas de React Router: devolver siempre index.html
  location / {
    try_files $uri /index.html;
  }

  # Reenviar /api al backend usando el nombre del servicio de Compose
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
